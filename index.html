<style>
/* ============================= CSS VARIABLES / THEME ============================= */
:root {
  --cream: #fdf3e6;
  --cream-2: #fbe8d3;
  --gold: #e6a445;
  --gold-2: #c9832f;
  --rose: #d98a8f;
  --rose-2: #c96b74;
  --plum: #4a2545;
  --plum-2: #331833;
  --plum-deep: #241123;
  --ink: #3a2038;
  --font-goofy: 'Baloo 2', 'Comic Sans MS', 'Segoe UI', system-ui, sans-serif;
  --font-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(160deg, var(--plum-deep), var(--plum) 45%, var(--rose-2) 100%);
  font-family: var(--font-goofy);
  color: var(--cream);
  -webkit-tap-highlight-color: transparent;
}

#app {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ============================= SCREEN SCAFFOLDING ============================= */
.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.screen.active {
  display: flex;
  opacity: 1;
}

.big-emoji { font-size: 3rem; margin-bottom: 8px; }

/* ============================= LANDING SCREEN ============================= */
#screen-landing h1 {
  font-size: clamp(2rem, 9vw, 3.6rem);
  font-weight: 800;
  line-height: 1.1;
  margin: 0 0 10px;
  text-shadow: 0 4px 20px rgba(0,0,0,0.35);
  max-width: 90vw;
}
#screen-landing .subtext {
  font-size: clamp(1rem, 3.5vw, 1.25rem);
  opacity: 0.85;
  margin: 0 0 40px;
  max-width: 520px;
}
.dodge-zone {
  position: relative;
  width: 100%;
  max-width: 640px;
  height: 160px;
  margin-bottom: 18px;
}
#btn-landing {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 22px 44px;
  font-family: var(--font-goofy);
  font-size: clamp(1.2rem, 4.5vw, 1.6rem);
  font-weight: 700;
  border: none;
  border-radius: 100px;
  background: linear-gradient(135deg, var(--gold), var(--gold-2));
  color: var(--plum-deep);
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 0 4px rgba(255,255,255,0.15) inset;
  will-change: transform;
  transition: transform 0.1s cubic-bezier(.2,.8,.2,1);
  white-space: nowrap;
}
#btn-landing:active { transform: translate(-50%, -50%) scale(0.94); }
.fine-print {

  font-size: 0.72rem;
  line-height: 1.5;
  opacity: 0.55;

}

/* ============================= LOADING SCREEN ============================= */
#screen-loading h2 {
  font-size: clamp(1.4rem, 5vw, 2rem);
  margin-bottom: 28px;

}
.progress-track {
  width: min(80vw, 420px);

}
.progress-fill {

#loading-percent {

  font-size: 1.1rem;
  opacity: 0.8;

/* ============================= QUIZ SCREEN ============================= */

.quiz-card {

}
.quiz-options {

}

/* ============================= FINAL MESSAGE CARD ============================= */

#btn-play-again {

/* ============================= REDUCED MOTION ============================= */

/* ============================= SMALL PHONE TUNING ============================= */
@media (max-width: 420px) {
  #photo-wrap { width: 110px; height: 110px; }
  .fine-print { font-size: 0.68rem; }
}

<body>

<div id="app">

  <!-- ===================== LANDING SCREEN ===================== -->
  <section id="screen-landing" class="screen active">

    <button id="mute-toggle" title="Mute / Unmute">🔊</button>

    </div>

</div>

<script>
/* =====================================================================
   CONFIG — edit every bit of wording / IDs here, nothing else needed.
   ===================================================================== */
const CONFIG = {
  landing: {
    headline: "DO NOT PRESS THIS BUTTON",
    subtext: "This button has been legally classified as 'extremely tempting.' You have been warned.",
    buttonText: "DO NOT PRESS",
    disclaimer: "By pressing this button you agree to the Terms & Conditions of Being Loved Forever, forfeit your right to remain unmarried, and acknowledge that all snacks in this household are now community property. Side effects may include butterflies, giggling, and mild regret about that time you ate her leftovers without asking."
  },

  loading: {
    messages: [
      "Calculating love...",
      "Consulting the horses...",
      "Tuning banjo...",
      "Bribing Cupid...",
      "Aligning the stars (they were being difficult)...",
      "Double-checking she's the one (yep, still the one)...",
      "Warming up the fiddle...",
      "Asking the dog for his blessing..."
    ],
    totalDurationMs: 5000,
    stallPercent: 99,
    stallDurationMs: 1400
  },

  quiz: {
    startingLabel: "Score",
    questions: [
      {
        question: "Who's the funniest in the relationship?",
        options: [
          { text: "The Smallest Babytas", response: "Correct! She's hilarious and you know it." },
          { text: "The Biggest Babytas", response: "Also correct! (Although some would say otherwise)." },
          { text: "It's a tie, we're both comedic legends", response: "100% correct! Comedy Olympics, gold medal, both of us." }
        ]
      },
      {
        question: "Who farts the most?",
        options: [
          { text: "The Smallest Babytas", response: "Correct! Silent but deadly, allegedly." },
          { text: "The Biggest Babytas", response: "Correct! But you still love me." },
          { text: "We refuse to answer on religious grounds", response: "Also correct! A wise and diplomatic choice." }
        ]
      },
      {
        question: "Who has the biggest... assets? (real estate portfolio, that is)",
        options: [
          { text: "The Smallest Babytas", response: "Correct! A truly impressive portfolio." },
          { text: "The Biggest Babytas", response: "Correct! Diversified and thriving." },
          { text: "This is a trick question and love wins either way", response: "Extremely correct! You get bonus points for that one." }
        ]
      }
    ]
  },

  payoff: {
    youtube: {
      videoId: "jH4YI1faPwU",
      listId: "PLWthMndjgpFIieKenym2a5BtYpf52eRX8",
      startSeconds: 35
    },
    photo: {
      src: "fiancee.jpeg",
      alt: "The most beautiful woman alive"
    },
    captions: [
      "The face that started this whole thing 🥹",
      "Certified 10/10, no notes",
      "My favorite person in the world",
      "She said yes and I still can't believe it",
      "Somehow gets more beautiful every day",
      "The real prize of this whole quiz"
    ],
    readButtonText: "💌 Read This",
    tapMusicText: "🔊 Tap for music"
  },

  finalMessage: {
    delayMs: 20000,
    text: "To the love of my life, the future mother of my kids and the woman I want to spend the rest of my existence with... I love you my most beautiful babytas, you are the love of my life, my other half, the soul I want to be attached to for the rest of eternity. I can't wait to spend this life with you, with the person that makes me happy, makes me a better man, and turns my life into everything I have ever want. I love you <3",
    playAgainText: "Play Again 💫"
  }
};

/* =====================================================================
   STATE
   ===================================================================== */
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouchDevice = window.matchMedia('(hover: none), (pointer: coarse)').matches;

let ytPlayer = null;
let ytReady = false;
let pendingAutoplay = false;

let heartsRafId = null;
let photoRafId = null;
let heartSpawnTimer = null;
let captionTimer = null;
let calmMode = false;

let quizIndex = 0;
let quizScore = 0;

/* =====================================================================
   HELPERS
   ===================================================================== */
function $(id) { return document.getElementById(id); }
function rand(min, max) { return Math.random() * (max - min) + min; }
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

/* =====================================================================
   LANDING SCREEN — dodging button
   ===================================================================== */
const LANDING_MAX_DODGES = (isTouchDevice || prefersReducedMotion) ? 0 : 2;
const LANDING_DODGE_RADIUS = 150; // px — how close the pointer can get before the button flees
let landingDodgeCount = 0;
let landingPointerWasNear = false; // edge-triggers the dodge so one continuous approach = one dodge

function resetLandingButton() {
  landingDodgeCount = 0;
  landingPointerWasNear = false;
  $('btn-landing').style.transform = 'translate(-50%, -50%)';
}

function initLanding() {
  $('landing-headline').textContent = CONFIG.landing.headline;
  $('landing-subtext').textContent = CONFIG.landing.subtext;
  $('btn-landing').textContent = CONFIG.landing.buttonText;
  $('landing-disclaimer').textContent = CONFIG.landing.disclaimer;

  const btn = $('btn-landing');
  const zone = document.querySelector('.dodge-zone');

  // Jump to whichever of several random spots ends up FARTHEST from the
  // pointer, so every dodge is a real escape and not a lateral shuffle
  // the cursor can just follow.
  function dodgeAwayFrom(pointerX, pointerY) {
    const zoneRect = zone.getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();
    const maxX = Math.max(0, (zoneRect.width - btnRect.width) / 2 - 10);
    const maxY = Math.max(0, (zoneRect.height - btnRect.height) / 2 - 10);
    const zoneCx = zoneRect.left + zoneRect.width / 2;
    const zoneCy = zoneRect.top + zoneRect.height / 2;

    let bestDx = 0, bestDy = 0, bestDist = -1;
    for (let i = 0; i < 10; i++) {
      const dx = rand(-maxX, maxX);
      const dy = rand(-maxY, maxY);
      const dist = Math.hypot((zoneCx + dx) - pointerX, (zoneCy + dy) - pointerY);
      if (dist > bestDist) { bestDist = dist; bestDx = dx; bestDy = dy; }
    }
    btn.style.transform = `translate(calc(-50% + ${bestDx}px), calc(-50% + ${bestDy}px))`;
  }

  function maybeDodge(pointerX, pointerY) {
    if (!$('screen-landing').classList.contains('active')) return;
    const btnRect = btn.getBoundingClientRect();
    const cx = btnRect.left + btnRect.width / 2;
    const cy = btnRect.top + btnRect.height / 2;
    const isNear = Math.hypot(pointerX - cx, pointerY - cy) < LANDING_DODGE_RADIUS;

    if (!isNear) { landingPointerWasNear = false; return; }
    // Only fire on the moment the pointer crosses INTO range, so one
    // continuous mouse approach can't burn through both dodges at once.
    if (landingPointerWasNear) return;
    landingPointerWasNear = true;

    if (landingDodgeCount >= LANDING_MAX_DODGES) return;
    landingDodgeCount++;
    dodgeAwayFrom(pointerX, pointerY);
  }

  // React while the pointer is still APPROACHING, not just once it's
  // already on the button — by then it's too late to escape a click.
  // Listens on the whole document (not just the small dodge-zone box) so
  // the "pointer moved away" reset works no matter where the cursor goes.
  document.addEventListener('mousemove', (e) => maybeDodge(e.clientX, e.clientY));
  btn.addEventListener('mouseenter', (e) => maybeDodge(e.clientX, e.clientY));

  btn.addEventListener('click', goToLoading);
}

/* =====================================================================
   FAKE LOADING SCREEN
   ===================================================================== */
function goToLoading() {
  showScreen('screen-loading');
  const fill = $('progress-fill');
  const percentLabel = $('loading-percent');
  const messageLabel = $('loading-message');
  fill.style.width = '0%';
  percentLabel.textContent = '0%';

  let msgIdx = 0;
  messageLabel.textContent = CONFIG.loading.messages[0];
  const msgInterval = setInterval(() => {
    msgIdx = (msgIdx + 1) % CONFIG.loading.messages.length;
    messageLabel.textContent = CONFIG.loading.messages[msgIdx];
  }, 750);

  const stallAt = CONFIG.loading.stallPercent;
  const rampDuration = CONFIG.loading.totalDurationMs - CONFIG.loading.stallDurationMs;
  const startTime = performance.now();
  let stalled = false;
  let stallStart = 0;

  function tick(now) {
    if (!stalled) {
      const elapsed = now - startTime;
      const pct = Math.min(stallAt, (elapsed / rampDuration) * stallAt);
      fill.style.width = pct + '%';
      percentLabel.textContent = Math.floor(pct) + '%';
      if (pct >= stallAt) {
        stalled = true;
        stallStart = now;
        clearInterval(msgInterval);
        messageLabel.textContent = "Hmm. One second.";
      }
      requestAnimationFrame(tick);
    } else {
      const stallElapsed = now - stallStart;
      if (stallElapsed >= CONFIG.loading.stallDurationMs) {
        fill.style.width = '100%';
        percentLabel.textContent = '100%';
        clearInterval(msgInterval);
        setTimeout(() => { goToQuiz(); }, 500);
      } else {
        requestAnimationFrame(tick);
      }
    }
  }
  requestAnimationFrame(tick);
}

/* =====================================================================
   QUIZ SCREEN
   ===================================================================== */
function goToQuiz() {
  quizIndex = 0;
  quizScore = 0;
  showScreen('screen-quiz');
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const q = CONFIG.quiz.questions[quizIndex];
  $('quiz-question').textContent = `Q${quizIndex + 1}. ${q.question}`;
  $('quiz-feedback').textContent = '';
  $('btn-quiz-continue').style.display = 'none';
  updateScoreLabel();

  const optionsWrap = $('quiz-options');
  optionsWrap.innerHTML = '';
  q.options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.textContent = opt.text;
    btn.addEventListener('click', () => handleQuizAnswer(btn, opt));
    optionsWrap.appendChild(btn);
  });
}

function updateScoreLabel() {
  const total = quizIndex; // questions answered so far
  $('quiz-score').textContent = total === 0
    ? `${CONFIG.quiz.startingLabel}: —`
    : `${CONFIG.quiz.startingLabel}: ${total}/${total} (100% · Suspiciously Perfect)`;
}

function handleQuizAnswer(chosenBtn, opt) {
  document.querySelectorAll('.quiz-option').forEach(b => {
    b.disabled = true;
    if (b === chosenBtn) b.classList.add('chosen');
  });
  $('quiz-feedback').textContent = opt.response;
  quizScore++;
  quizIndex++;
  $('quiz-score').textContent = `${CONFIG.quiz.startingLabel}: ${quizIndex}/${quizIndex} (100% · Suspiciously Perfect)`;

  if (quizIndex >= CONFIG.quiz.questions.length) {
    // Last question just got submitted — kick off the song right now (still
    // inside this click's user gesture) so it's already playing by the time
    // the payoff screen appears, instead of waiting for another click.
    attemptPlay();
  }

  const continueBtn = $('btn-quiz-continue');
  continueBtn.style.display = 'inline-block';
  continueBtn.textContent = quizIndex < CONFIG.quiz.questions.length ? 'Next →' : 'See Your Results →';
  continueBtn.onclick = () => {
    if (quizIndex < CONFIG.quiz.questions.length) {
      renderQuizQuestion();
    } else {
      goToPayoff();
    }
  };
}

/* =====================================================================
   YOUTUBE IFRAME API — created early so it's ready by the time we need it
   ===================================================================== */
function loadYouTubeAPI() {
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}

window.onYouTubeIframeAPIReady = function () {
  ytPlayer = new YT.Player('yt-player', {
    height: '1',
    width: '1',
    playerVars: {
      list: CONFIG.payoff.youtube.listId,
      listType: 'playlist',
      autoplay: 0,
      controls: 0,
      playsinline: 1,
      start: CONFIG.payoff.youtube.startSeconds
    },
    videoId: CONFIG.payoff.youtube.videoId,
    events: {
      onReady: function () {
        ytReady = true;
        if (pendingAutoplay) attemptPlay();
      },
      onStateChange: function (e) {
        // playerVars.start is unreliable once a list/listType is attached,
        // so force the seek once playback actually begins. Seeking the
        // instant PLAYING fires is too early for the player to honor, so
        // give it a brief moment first.
        if (e.data === YT.PlayerState.PLAYING && !hasSeekedToStart) {
          hasSeekedToStart = true;
          setTimeout(() => {
            try { ytPlayer.seekTo(CONFIG.payoff.youtube.startSeconds, true); } catch (err) {}
          }, 300);
        }
      }
    }
  });
};

let hasSeekedToStart = false;

function attemptPlay() {
  if (!ytPlayer || !ytReady) { pendingAutoplay = true; return; }
  try {
    ytPlayer.playVideo();
  } catch (e) { /* ignore */ }
  setTimeout(() => {
    if (ytPlayer && ytPlayer.getPlayerState && ytPlayer.getPlayerState() !== 1) {
      $('btn-tap-music').style.display = 'inline-block';
    }
  }, 1200);
}

$('btn-tap-music').addEventListener('click', () => {
  if (ytPlayer) {
    try { ytPlayer.unMute(); ytPlayer.playVideo(); } catch (e) {}
  }
  $('btn-tap-music').style.display = 'none';
});

$('mute-toggle').addEventListener('click', () => {
  if (!ytPlayer) return;
  if (ytPlayer.isMuted()) {
    ytPlayer.unMute();
    $('mute-toggle').textContent = '🔊';
  } else {
    ytPlayer.mute();
    $('mute-toggle').textContent = '🔇';
  }
});

/* =====================================================================
   PAYOFF SCREEN
   ===================================================================== */
function goToPayoff() {
  showScreen('screen-payoff');
  calmMode = false;
  attemptPlay(); // user-gesture-adjacent: called from click handler chain
  startPhotoBounce();
  startHearts();
  burstConfetti(120);
  startCaptions();
  $('btn-read-this').style.display = 'inline-block';

  setTimeout(showFinalMessage, CONFIG.finalMessage.delayMs);
}

/* --- Photo fallback if image fails to load --- */
$('photo-img').addEventListener('error', () => {
  $('photo-img').style.display = 'none';
  $('photo-fallback').style.display = 'flex';
});

/* --- DVD-screensaver style bounce --- */
function startPhotoBounce() {
  const wrap = $('photo-wrap');
  const payoffScreen = $('screen-payoff');
  let bounds = payoffScreen.getBoundingClientRect();
  const size = wrap.offsetWidth;

  let x = rand(0, Math.max(1, bounds.width - size));
  let y = rand(0, Math.max(1, bounds.height - size));
  const speedMult = prefersReducedMotion ? 0.35 : 1;
  let vx = rand(1.2, 2.2) * speedMult;
  let vy = rand(1.2, 2.2) * speedMult;
  let angle = 0;
  let wobbleT = 0;

  function frame() {
    bounds = payoffScreen.getBoundingClientRect();
    const maxX = Math.max(1, bounds.width - size);
    const maxY = Math.max(1, bounds.height - size);

    x += vx;
    y += vy;
    wobbleT += 0.05;

    if (x <= 0) { x = 0; vx = Math.abs(vx); }
    if (x >= maxX) { x = maxX; vx = -Math.abs(vx); }
    if (y <= 0) { y = 0; vy = Math.abs(vy); }
    if (y >= maxY) { y = maxY; vy = -Math.abs(vy); }

    angle += (prefersReducedMotion ? 0.15 : 0.4);
    const wobble = Math.sin(wobbleT) * (prefersReducedMotion ? 1.5 : 4);
    const scaleWobble = 1 + Math.sin(wobbleT * 1.3) * (prefersReducedMotion ? 0.01 : 0.03);

    wrap.style.transform =
      `translate3d(${x}px, ${y}px, 0) rotate(${angle % 360}deg) scale(${scaleWobble})`;
    wrap.dataset.cx = x + size / 2;
    wrap.dataset.cy = y + size / 2;

    photoRafId = requestAnimationFrame(frame);
  }
  photoRafId = requestAnimationFrame(frame);
}

/* --- Floating hearts rising from the bottom --- */
function spawnHeart(originX, originY, burst) {
  const layer = $('hearts-layer');
  const el = document.createElement('div');
  el.className = 'floating-heart';
  const emojis = ['💖', '💗', '💕', '❤️', '💘', '🧡'];
  el.textContent = emojis[Math.floor(rand(0, emojis.length))];
  const size = rand(16, 40);
  el.style.fontSize = size + 'px';
  layer.appendChild(el);

  const bounds = layer.getBoundingClientRect();
  let x = originX !== undefined ? originX : rand(0, bounds.width);
  let y = originY !== undefined ? originY : bounds.height + 20;

  const speedMult = (prefersReducedMotion ? 0.4 : 1) * (calmMode ? 0.6 : 1);
  const speed = rand(0.6, 1.6) * speedMult;
  const drift = rand(-0.6, 0.6);
  const driftFreq = rand(0.01, 0.03);
  let burstVX = 0, burstVY = 0;
  if (burst) {
    const a = rand(0, Math.PI * 2);
    const s = rand(2, 6);
    burstVX = Math.cos(a) * s;
    burstVY = Math.sin(a) * s;
  }

  let t = 0;
  let life = 0;
  const maxLife = burst ? rand(60, 100) : 99999;

  function frame() {
    t += driftFreq;
    life++;
    if (burst) {
      x += burstVX;
      y += burstVY;
      burstVX *= 0.94;
      burstVY *= 0.94;
      el.style.opacity = Math.max(0, 1 - life / maxLife);
    } else {
      y -= speed;
      x += Math.sin(t) * drift;
    }
    el.style.transform = `translate3d(${x}px, ${y}px, 0)`;

    const outOfView = y < -60 || y > bounds.height + 80 || x < -60 || x > bounds.width + 60;
    if ((burst && life >= maxLife) || (!burst && outOfView)) {
      el.remove();
    } else {
      requestAnimationFrame(frame);
    }
  }
  requestAnimationFrame(frame);
}

function startHearts() {
  function loopSpawn() {
    spawnHeart();
    const delay = calmMode ? rand(500, 900) : rand(180, 420);
    heartSpawnTimer = setTimeout(loopSpawn, delay);
  }
  loopSpawn();

  $('screen-payoff').addEventListener('click', (e) => {
    const count = prefersReducedMotion ? 5 : 12;
    for (let i = 0; i < count; i++) spawnHeart(e.clientX, e.clientY, true);
  });
  $('screen-payoff').addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    if (!t) return;
    const count = prefersReducedMotion ? 5 : 12;
    for (let i = 0; i < count; i++) spawnHeart(t.clientX, t.clientY, true);
  }, { passive: true });
}

/* --- Confetti burst on entry --- */
function burstConfetti(count) {
  if (prefersReducedMotion) count = Math.floor(count / 4);
  const layer = $('confetti-layer');
  const colors = ['#e6a445', '#d98a8f', '#fdf3e6', '#c9832f', '#c96b74'];
  const bounds = layer.getBoundingClientRect();

  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const w = rand(6, 12);
    const h = rand(8, 16);
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.background = colors[Math.floor(rand(0, colors.length))];
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    layer.appendChild(el);

    let x = rand(0, bounds.width);
    let y = rand(-40, -10);
    const vy = rand(2, 5);
    let vx = rand(-1.5, 1.5);
    let rot = rand(0, 360);
    const rotSpeed = rand(-8, 8);
    let life = 0;
    const maxLife = rand(140, 220);

    (function frame() {
      y += vy;
      x += vx;
      rot += rotSpeed;
      life++;
      el.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${rot}deg)`;
      el.style.opacity = Math.max(0, 1 - life / maxLife);
      if (life < maxLife && y < bounds.height + 40) {
        requestAnimationFrame(frame);
      } else {
        el.remove();
      }
    })();
  }
}

/* --- Rotating captions near the photo --- */
function startCaptions() {
  const bubble = $('caption-bubble');
  const captions = CONFIG.payoff.captions;
  let idx = 0;

  function showNext() {
    const wrap = $('photo-wrap');
    const cx = parseFloat(wrap.dataset.cx || 0);
    const cy = parseFloat(wrap.dataset.cy || 0);
    bubble.style.left = cx + 'px';
    bubble.style.top = Math.max(40, cy - 90) + 'px';
    bubble.textContent = captions[idx % captions.length];
    idx++;
    bubble.style.opacity = '1';

    setTimeout(() => { bubble.style.opacity = '0'; }, 2600);
  }

  showNext();
  captionTimer = setInterval(showNext, 4000);
}

/* --- Read This / final message --- */
$('btn-read-this').addEventListener('click', showFinalMessage);

let finalShown = false;
function showFinalMessage() {
  if (finalShown) return;
  finalShown = true;
  calmMode = true;
  $('final-message-text').textContent = CONFIG.finalMessage.text;
  $('final-message').classList.add('show');
}

/* =====================================================================
   PLAY AGAIN — full reset back to landing
   ===================================================================== */
$('btn-play-again').addEventListener('click', resetToLanding);

function resetToLanding() {
  if (ytPlayer) {
    try { ytPlayer.stopVideo(); } catch (e) {}
  }
  if (heartSpawnTimer) clearTimeout(heartSpawnTimer);
  if (captionTimer) clearInterval(captionTimer);
  if (photoRafId) cancelAnimationFrame(photoRafId);

  $('hearts-layer').innerHTML = '';
  $('confetti-layer').innerHTML = '';
  $('final-message').classList.remove('show');
  finalShown = false;
  calmMode = false;
  $('btn-tap-music').style.display = 'none';
  $('caption-bubble').style.opacity = '0';
  $('photo-img').style.display = 'block';
  $('photo-fallback').style.display = 'none';

  hasSeekedToStart = false;
  resetLandingButton();

  showScreen('screen-landing');
}

/* =====================================================================
   BOOT
   ===================================================================== */
initLanding();
loadYouTubeAPI();
</script>
</body>
